<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#241c33">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>错题本 - 单词刷题器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mistakes">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">词</span>
        <span class="brand-copy">
          <strong>单词刷题器</strong>
          <span class="eyebrow">Vocabulary Quiz</span>
        </span>
      </a>
      <div class="nav-links">
        <a href="index.html" data-nav="home">首页</a>
        <a href="practice.html" data-nav="practice">练习</a>
        <a href="browse.html" data-nav="browse">词库</a>
        <a href="mistakes.html" data-nav="mistakes">错题本</a>
        <a href="stats.html" data-nav="stats">统计</a>
      </div>
      <div class="status-group">
        <span class="status-pill">进度 <strong id="pill-progress">–</strong></span>
        <span class="status-pill">错题本 <strong id="pill-mistakes">–</strong></span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
        <h2 style="margin-bottom:0;">错题本 <span id="count-text" style="font-size:14px; color:var(--text-sub); font-weight:400;"></span></h2>
        <a class="btn btn-primary" id="btn-repractice" href="practice.html?scope=mistakes">错题重练</a>
      </div>
      <div id="mistake-list"></div>
    </div>
  </div>

  <script src="js/words.js"></script>
  <script src="js/app.js"></script>
  <script>
    markActiveNav();
    renderTopbarPills();

    function render() {
      var mistakes = Store.getMistakes();
      var listEl = document.getElementById('mistake-list');
      document.getElementById('count-text').textContent = '（共 ' + mistakes.length + ' 词）';

      if (!mistakes.length) {
        document.getElementById('btn-repractice').style.display = 'none';
        listEl.innerHTML = '<div class="empty-state"><div class="icon">✓</div>错题本是空的，去练习页刷几轮吧。</div>';
        return;
      }
      document.getElementById('btn-repractice').style.display = '';

      listEl.innerHTML = mistakes.map(function (m) {
        var w = getWord(m.word);
        if (!w) return '';
        var reason = REASON_LABEL[m.reason] || '标记';
        var tagClass = m.reason === 'manual' ? 'tag-amber' : 'tag-red';
        return '<div class="mistake-item">' +
          '<div class="w"><b>' + escapeHtml(w.word) + '</b></div>' +
          '<div class="info">' +
            '<div>' + posTagsHtml(w.pos) + '</div>' +
            '<div class="m">' + escapeHtml(w.meaning) + '</div>' +
            '<div class="meta">加入时间：' + fmtDateTime(m.time) + '</div>' +
          '</div>' +
          '<span class="tag ' + tagClass + '">' + reason + '</span>' +
          '<button class="btn btn-ghost btn-sm" data-word="' + escapeHtml(w.word) + '">移除</button>' +
        '</div>';
      }).join('');

      listEl.querySelectorAll('button[data-word]').forEach(function (b) {
        b.addEventListener('click', function () {
          Store.removeMistake(b.getAttribute('data-word'));
          showToast('已移出错题本');
          render();
          renderTopbarPills();
        });
      });
    }
    render();
  </script>
</body>
</html>
