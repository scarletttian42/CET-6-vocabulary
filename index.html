<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词刷题器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">单词刷题器</a>
      <div class="nav-links">
        <a href="index.html" data-nav="home">首页</a>
        <a href="practice.html" data-nav="practice">练习</a>
        <a href="browse.html" data-nav="browse">词库</a>
        <a href="mistakes.html" data-nav="mistakes">错题本</a>
        <a href="stats.html" data-nav="stats">统计</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="hero">
      <h1>背单词刷题练习</h1>
      <p class="subtitle" id="subtitle">正在加载词库…</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="practice.html?mode=spell">开始拼写练习</a>
        <a class="btn btn-outline" href="practice.html?mode=pos">开始词性自测</a>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="num" id="st-total">0</div><div class="label">词库总词数</div></div>
      <div class="stat-box"><div class="num green" id="st-learned">0</div><div class="label">已练过词数</div></div>
      <div class="stat-box"><div class="num red" id="st-mistakes">0</div><div class="label">错题本</div></div>
      <div class="stat-box"><div class="num" id="st-rounds">0</div><div class="label">累计刷题轮数</div></div>
    </div>

    <h2 style="font-size:18px; margin: 26px 0 14px;">两种刷题模式</h2>
    <div class="feature-grid">
      <div class="card">
        <div class="feature-num">模式一</div>
        <h3>拼写模式</h3>
        <p>给出中文释义和词性提示，输入对应的英文单词，系统自动判分。适合检验能否主动拼出单词。</p>
      </div>
      <div class="card">
        <div class="feature-num">模式二</div>
        <h3>词性自测</h3>
        <p>看到英文单词后先点选词性，再自己回忆中文释义，点揭晓按钮核对。一词多性需要全部选对。</p>
      </div>
      <div class="card">
        <div class="feature-num">巩固</div>
        <h3>错题沉淀</h3>
        <p>拼写答错、词性选错自动进入错题本；词性自测中没回忆起释义也可手动标记，随时集中重练。</p>
      </div>
    </div>

    <div class="footer">数据保存在浏览器本地 · 词库更新见 words.js 文件</div>
  </div>

  <script src="js/words.js"></script>
  <script src="js/app.js"></script>
  <script>
    markActiveNav();
    var words = getAllWords();
    var stats = Store.getStats();
    var learned = Object.keys(stats).filter(function (w) { return stats[w].seen > 0 && getWord(w); }).length;
    document.getElementById('subtitle').textContent =
      '当前词库共 ' + words.length + ' 个单词，支持拼写练习、词性自测与错题重练。';
    document.getElementById('st-total').textContent = words.length;
    document.getElementById('st-learned').textContent = learned;
    document.getElementById('st-mistakes').textContent = Store.getMistakes().length;
    document.getElementById('st-rounds').textContent = Store.getHistory().length;
  </script>
</body>
</html>
